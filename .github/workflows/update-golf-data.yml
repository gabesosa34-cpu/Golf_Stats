name: Update golf data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1"

permissions:
  contents: write

concurrency:
  group: update-golf-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect latest PGA Tour stats
        run: python collect_golf_stats.py

      - name: Sync dashboard data
        run: python sync_dashboard_data.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- index.html upcoming_tournaments_2026.json golfer_performance_history.json golfer_performance_stats_2026.json; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html upcoming_tournaments_2026.json golfer_performance_history.json golfer_performance_stats_2026.json
          git commit -m "Update golf stats data"
          git push
